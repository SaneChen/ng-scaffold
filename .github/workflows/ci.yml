# Continuous integration: every push and pull request must lint, test and build.
# Node 24 satisfies the Angular CLI 22.2 engine range (^22.22.3 || ^24.15.0 || >=26.0.0).
name: CI

on:
  push:
    branches: [main, ng-matero]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NG_CLI_ANALYTICS: 'false'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TypeScript and templates
        run: yarn lint

      - name: Lint styles
        run: yarn lint:scss

      - name: Unit tests
        run: yarn test --watch=false

      - name: Starter packaging tests
        run: node --test tools/pack-starter.spec.mjs

      - name: Schematic insertion tests
        run: yarn schematics:test

      - name: Packaged schematic integration tests
        run: yarn schematics:integration

      - name: Offline local tarball golden tests
        env:
          NG_CLI_ANALYTICS: 'false'
        run: yarn schematics:golden

      - name: Production build
        run: yarn build

      - name: Browser tooling tests
        run: node --test tools/pages.spec.mjs tools/e2e-routes.spec.mjs

      - name: Browser test lint and types
        run: yarn e2e:lint && yarn e2e:types

      - name: Browser accessibility and integration tests
        run: google-chrome --version && yarn e2e

      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ng-matero'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          yarn ng build --base-href "${BASE_PATH%/}/"
          node tools/prepare-pages.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/ng-scaffold/browser
          include-hidden-files: true
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
