<app-page-header />

@for (example of examples; track example) {
  <mat-card appearance="outlined">
    <mat-card-header>
      <h2 mat-card-title>{{ 'demo.material.sidenav.' + example + '.title' | translate }}</h2>
    </mat-card-header>
    <mat-card-content>
      <p>{{ 'demo.material.sidenav.' + example + '.text' | translate }}</p>
    </mat-card-content>
    <mat-card-actions>
      <a matButton="tonal" [routerLink]="example">
        {{ 'demo.material.sidenav.' + example + '.open' | translate }}
      </a>
    </mat-card-actions>
  </mat-card>
}
