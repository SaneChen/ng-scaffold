<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NgScaffold</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      [ng-scaffold] Step 1: apply the stored theme, direction and language before the first paint.
      SettingsStore keeps the user's choice in localStorage ("ng-scaffold-settings") and mirrors it
      onto <html> (theme-dark / theme-auto class, dir) and LanguageStore sets <html lang>, but only
      once the application has started. This script does the same right away, so the loader below
      and the first frames of the application use the chosen color scheme, direction and language
      instead of flashing the defaults. Without a valid stored choice it uses `defaults`, which
      must match the application's (defaultAppSettings, or provideAppSettings() when an
      application changes them). The language is matched like resolveLanguage() in
      src/app/core/i18n/languages.ts, against the same LANGUAGES and DEFAULT_LANGUAGE.
      src/index.spec.ts runs this script and fails when any of these copies drifts.
      Under a Content-Security-Policy, inline scripts need a hash or nonce; the `security.autoCsp`
      build option of angular.json adds the hashes automatically.
    -->
    <script>
      (function () {
        const defaults = { theme: 'auto', dir: 'ltr', language: 'auto' };
        let stored = {};
        try {
          stored = JSON.parse(localStorage.getItem('ng-scaffold-settings') ?? '{}') ?? {};
        } catch {
          // Storage blocked or unreadable: keep the defaults.
        }
        const root = document.documentElement;
        const theme = ['light', 'dark', 'auto'].includes(stored.theme)
          ? stored.theme
          : defaults.theme;
        if (theme !== 'light') {
          root.classList.add('theme-' + theme);
        }
        root.dir = ['ltr', 'rtl'].includes(stored.dir) ? stored.dir : defaults.dir;

        const languages = ['en-US', 'zh-CN', 'zh-TW'];
        const browser = navigator.languages ?? [];
        const setting = typeof stored.language === 'string' ? stored.language : defaults.language;
        const wanted = setting === 'auto' ? browser : [setting, ...browser];
        root.lang = 'en-US';
        for (const tag of wanted) {
          try {
            const locale = new Intl.Locale(tag).maximize();
            const same = languages
              .map(code => ({ code, locale: new Intl.Locale(code).maximize() }))
              .filter(option => option.locale.language === locale.language);
            const match =
              same.find(option => option.locale.baseName === locale.baseName) ??
              same.find(option => option.locale.script === locale.script) ??
              same[0];
            if (match) {
              root.lang = match.code;
              break;
            }
          } catch {
            // Not a well-formed language tag: try the next one.
          }
        }
      })();
    </script>
    <!--
      [ng-scaffold] Step 2: critical styles of the start-up loader (#globalLoader below). They are
      inline so the loader paints before the stylesheet and scripts download. Colors repeat the
      light/dark values of --mat-sys-surface, --mat-sys-on-surface, --mat-sys-primary and
      --mat-sys-outline-variant, which do not exist yet at this point, and are chosen the same way
      as those tokens: `light-dark()` follows the loader's `color-scheme`, which the theme class of
      Step 1 sets (light by default, dark for theme-dark, the operating system's for theme-auto).
    -->
    <style>
      .global-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        font:
          400 1rem / 1.5 Roboto,
          system-ui,
          sans-serif;
        color: light-dark(#1a1b1f, #e3e2e6);
        color-scheme: light;
        background-color: light-dark(#faf9fd, #121316);
        opacity: 1;
        transition: opacity 300ms ease-out;
      }

      html.theme-dark .global-loader {
        color-scheme: dark;
      }

      html.theme-auto .global-loader {
        color-scheme: light dark;
      }

      .global-loader-fade-out {
        pointer-events: none;
        opacity: 0;
      }

      .global-loader-spinner {
        box-sizing: border-box;
        width: 48px;
        height: 48px;
        border: 4px solid light-dark(#c4c6d0, #44474e);
        border-top-color: light-dark(#005cbb, #abc7ff);
        border-radius: 50%;
        animation: global-loader-spin 1s linear infinite;
      }

      .global-loader-text {
        margin: 0;
        letter-spacing: 0.03em;
      }

      @keyframes global-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .global-loader {
          transition: none;
        }

        .global-loader-spinner {
          animation: none;
        }
      }

      /*
        [ng-scaffold] The color scheme of the page itself, repeated from src/styles/_themes.scss
        (keep both in sync). The production build inlines the critical rules of styles.css and
        loads the rest without blocking rendering, but Beasties inlines only rules that match the
        HTML at build time, and no theme-* class exists before the Step 1 script runs. Without
        this copy, a dark page would stay light from the moment the loader is removed until the
        stylesheet arrives. These selectors outrank the inlined `body { color-scheme: light }`.
      */
      html.theme-dark,
      html.theme-dark body {
        color-scheme: dark;
      }

      html.theme-auto,
      html.theme-auto body {
        color-scheme: light dark;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <!--
      [ng-scaffold] Step 3: start-up loader shown until the first page has rendered; Preloader
      (src/app/core/preloader) fades it out and removes it. role="status" marks the text as the
      page's status for assistive technologies (text present from the start is usually not
      announced on its own). dir="auto" keeps the ellipsis after the word when the page is
      right-to-left; `lang` names the language of the text, even if the application later falls
      back to another one.
    -->
    <div id="globalLoader" class="global-loader" role="status" aria-live="polite">
      <div class="global-loader-spinner" aria-hidden="true"></div>
      <p class="global-loader-text" dir="auto" lang="en-US">Loading…</p>
    </div>
    <!--
      [ng-scaffold] Step 4: the loader text in the language chosen by Step 1 (the translation files
      load only with the application). These are copies of `layout.starting` in public/i18n: add
      a line for every language added to LANGUAGES (src/index.spec.ts checks both).
    -->
    <script>
      (function () {
        const lang = document.documentElement.lang;
        const text = {
          'zh-CN': '加载中…',
          'zh-TW': '載入中…',
        }[lang];
        if (text) {
          const element = document.querySelector('#globalLoader .global-loader-text');
          element.textContent = text;
          element.lang = lang;
        }
      })();
    </script>
  </body>
</html>
